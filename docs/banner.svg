<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="ignite-scribe: your desktop, readable by agents, redacted first">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1720"/>
      <stop offset="1" stop-color="#1b2533"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a014"/>
      <stop offset="1" stop-color="#ed1c24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- a window, as an agent would see it -->
  <g transform="translate(70 52)">
    <rect width="420" height="196" rx="10" fill="#0b1118" stroke="#2c3a4d" stroke-width="2"/>
    <rect width="420" height="30" rx="10" fill="#1f2b3b"/>
    <rect y="20" width="420" height="10" fill="#1f2b3b"/>
    <circle cx="20" cy="15" r="5" fill="#ed1c24"/>
    <circle cx="38" cy="15" r="5" fill="#f0a014"/>
    <circle cx="56" cy="15" r="5" fill="#3fb950"/>
    <text x="80" y="20" font-family="Consolas, 'Cascadia Mono', monospace" font-size="13" fill="#8b9bb0">build.log - Notepad</text>
    <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="15">
      <text x="22" y="66" fill="#c9d4e0">[uia, Document]</text>
      <text x="22" y="94" fill="#c9d4e0">compiling unit_041.c</text>
      <text x="22" y="122" fill="#c9d4e0">token</text>
      <rect x="80" y="108" width="170" height="18" rx="3" fill="#2a3442"/>
      <text x="90" y="122" font-size="12" fill="#6d7d91">[secret withheld]</text>
      <text x="22" y="150" fill="#3fb950">Build succeeded in 4.2 s</text>
      <text x="22" y="178" fill="#6d7d91">wait_for("succeeded") woke in 56 ms</text>
    </g>
  </g>

  <!-- the tray dot -->
  <circle cx="490" cy="248" r="13" fill="#f0a014" stroke="#3c3c3c" stroke-width="2"/>

  <!-- title -->
  <g transform="translate(560 0)">
    <text x="0" y="132" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="64" font-weight="700" fill="#f2f5f8">ignite-scribe</text>
    <rect x="2" y="152" width="300" height="5" rx="2.5" fill="url(#glow)"/>
    <text x="0" y="198" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="24" fill="#b7c3d0">Your desktop, readable by agents.</text>
    <text x="0" y="232" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="24" fill="#b7c3d0">Redacted before it leaves your PC.</text>
  </g>
</svg>
